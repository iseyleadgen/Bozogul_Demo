<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anfrage-Demo für Bozogul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --ink:#000000; --mute:#5B606B; --line:#E1E5EE;
  --acc:#0E6CB3; --acc-ink:#0A5592; --acc-soft:#EAF3FB; --btn:#000000; --on-btn:#FFFFFF;
  --hd:#000000; --bubble:#DCF8C6; --bubble-ink:#111111; --err:#B3261E; --ok:#137A45; --ok-soft:#E6F6EE;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1117; --surface:#171B23; --ink:#F2F4F8; --mute:#A3A9B6; --line:#2A303C;
    --acc:#2F8BD6; --acc-ink:#8CC2F0; --acc-soft:#10263A; --btn:#F2F4F8; --on-btn:#000000;
    --hd:#000000; --bubble:#1F4D37; --bubble-ink:#EAF6EF; --err:#FF8A80; --ok:#5BD198; --ok-soft:#12301F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1117; --surface:#171B23; --ink:#F2F4F8; --mute:#A3A9B6; --line:#2A303C;
  --acc:#2F8BD6; --acc-ink:#8CC2F0; --acc-soft:#10263A; --btn:#F2F4F8; --on-btn:#000000;
  --hd:#000000; --bubble:#1F4D37; --bubble-ink:#EAF6EF; --err:#FF8A80; --ok:#5BD198; --ok-soft:#12301F; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.slab{font-family:"Alfa Slab One",Rockwell,Georgia,serif;font-weight:400}
.demo-bar{background:#000;color:#fff;font-size:13px;padding:8px 12px;display:flex;align-items:center;gap:10px;justify-content:center}
.demo-bar span{flex:1;text-align:center}
.lang{display:flex;border:1px solid #444;border-radius:20px;overflow:hidden;flex:0 0 auto}
.lang button{background:none;border:0;color:#bbb;font-size:12px;font-weight:600;padding:4px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--acc);color:#fff}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 40px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin:4px 0 18px}.brand img{height:40px;width:auto;background:#fff;border-radius:6px;padding:4px 6px;display:block}.brand .mk{width:44px;height:44px;border-radius:12px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:0 0 auto}.brand b{display:block;font-size:17px;line-height:1.2}
.brand img{height:44px;max-width:100%;display:block;margin:0 auto}
.brand span{display:block;font-size:13px;color:var(--mute)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 20px}
.prog{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:6px;margin:8px 0 22px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .3s ease}
h1,h2{font-family:Poppins,"Segoe UI",system-ui,sans-serif;font-weight:700;letter-spacing:-.01em}
h1{font-size:27px;line-height:1.2;margin:0 0 10px}
h2{font-size:21px;line-height:1.25;margin:0 0 6px}
.hint{color:var(--mute);font-size:14px;margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:15px;cursor:pointer;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-ink);font-weight:600}
.group-label{font-weight:600;font-size:15px;margin:18px 0 8px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-weight:600;font-size:16px;cursor:pointer;background:var(--acc);color:#fff;margin-top:24px}
.btn.red{background:#C4291C;color:#fff}
.choice{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.choice b{display:block;font-size:16px;color:var(--ink)}
.choice span{font-size:13.5px;color:var(--mute)}
.choice.em{border-color:#C4291C}.choice.em b{color:#C4291C}
.choice[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.warn{border-left:4px solid #C4291C;background:#FCEBE9;color:#2A1210;border-radius:8px;padding:10px 12px;font-size:14px;margin-top:14px}
.alertline{display:flex;gap:8px;align-items:center;background:#FCEBE9;color:#8E1D13;border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:600;margin-top:12px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.row-btns{display:flex;gap:10px;align-items:center;margin-top:24px}
.row-btns .btn{margin:0}
.back{background:none;border:0;color:var(--mute);padding:12px 6px;cursor:pointer;font-size:15px;flex:0 0 auto}
.link{background:none;border:0;color:var(--acc-ink);font-weight:600;padding:10px 0;cursor:pointer;font-size:15px;display:block;margin:12px auto 0}
label.f{display:block;font-weight:600;font-size:15px;margin:14px 0 6px}
input.t,textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px}
textarea{min-height:120px;resize:vertical}
.err{color:var(--err);font-size:14px;margin-top:10px;min-height:1px}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:22px;text-align:center;cursor:pointer;display:block}
.drop b{display:block;color:var(--acc-ink)}
.drop span{font-size:14px;color:var(--mute)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.intro-list{margin:18px 0 0;padding:0;list-style:none;font-size:15px;color:var(--mute)}
.intro-list li{padding:8px 0;border-top:1px solid var(--line)}
.intro-list li:first-child{border-top:0}
.tick{width:52px;height:52px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:26px;margin-bottom:14px}
.sms-label{font-size:13px;color:var(--mute);margin:20px 0 6px}
.sms{background:var(--bubble);color:var(--bubble-ink);border-radius:14px 14px 14px 4px;padding:10px 13px;font-size:15px;max-width:92%}
.switch{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.switch button{border:0;background:none;border-radius:10px;padding:10px;font-weight:600;font-size:14px;cursor:pointer;color:var(--mute)}
.switch button[aria-pressed="true"]{background:var(--acc);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.card-hd{background:#0B1218;color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:4px solid var(--acc)}
.card-hd small{font-size:12px;opacity:.7;display:block}
.card-hd b{font-weight:700;font-size:19px;line-height:1.25;display:block}
.pill{white-space:nowrap;background:var(--acc);color:#fff;font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px}
.dl{margin:0}
.dl div{display:flex;gap:12px;padding:11px 20px;border-bottom:1px solid var(--line);font-size:15px}
.dl dt{flex:0 0 120px;color:var(--mute)}
.dl dd{margin:0;font-weight:500}
.words{padding:14px 20px 18px;font-size:15px}
.words b{display:block;font-size:13px;color:var(--acc-ink);margin-bottom:4px}
.card .thumbs{padding:0 20px 18px;margin:0}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0 6px}
.stage{text-align:center;font-size:12px;color:var(--mute);line-height:1.3}
.stage i{display:block;height:6px;border-radius:6px;background:var(--line);margin-bottom:6px;transition:background .3s}
.stage.done i{background:var(--acc)}
.stage.now{color:var(--ink);font-weight:600}
.next-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin-top:14px}
.next-box h3{font-size:16px;margin:0 0 4px}
.next-box p{margin:0;color:var(--mute);font-size:14px}
.next-box .sms{margin-top:12px}
.foot{text-align:center;font-size:13px;color:var(--mute);margin-top:28px}
.foot a{color:var(--acc-ink);font-weight:600;text-decoration:none}
.reveal{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}.bar i,.stage i{transition:none}}
</style>
</head>

  qNotes:'What’s happening?',qNotesHrep:'Error message, noises, dripping, not heating …',qNotesHmnt:'When was the last service? Anything unusual?',qNotesP:'For example: boiler shows fault F28, heating stays cold',
  qPhotos:'Add photos',qPhotosH:{em:'Show us the spot, if it’s safe to do so',proj:'The room or the existing system',svc:'The system and its nameplate'},add:'Add photos',addS:'From your camera or gallery',skip:'Continue without photos',
  qContact:'How can we reach you?',qContactH:{em:'We’ll call you back as soon as possible',other:'We’ll get back to you on WhatsApp or by phone'},nm:'Name',pn:'Phone',ar:'Address',callL:'Preferred time',send:'Send request',sendEm:'Report emergency',
  errN:'Please enter your name.',errP:'Please enter a phone number.',errA:'Please enter the address.',
  thanks:f=>`Thanks, ${f}. We’ve got your request.`,thanksEm:f=>`Thanks, ${f}. Your emergency report is with our team.`,
  thanksP:'Bozogul will get back to you with a suggested time.',thanksEmP:'We’ll call you back as soon as possible. If there’s immediate danger, please call us directly.',
  smsL:'The customer gets this WhatsApp message right away',
  sms:(f,p)=>`Hi ${f}, thanks for your request with Bozogul! We’ve got your details${p?' and photos':''} and will get back to you with a suggested time.`,
  smsEm:f=>`Hi ${f}, your emergency report has reached Bozogul. Our team will call you back as soon as possible.`,
  see:'See what Bozogul receives',restart:'Start over',cust:'Customer',recv:'What you receive',newReq:'New request',newEm:'Emergency',notGiven:'Not given',anyTime:'Any time',photosN:n=>`${n} added`,noPhotos:'None',words:'Customer note',
  alertTeam:'The responsible person was alerted right away',
  rows:{type:'Request',what:'What',bld:'Property',heat:'Heating',when:'Timing',unit:'System',age:'Age',name:'Customer',phone:'Phone',addr:'Address',time:'Preferred time',photos:'Photos'},
  flows:{
   em:{st:['Reported','Callback','Callout','Done'],pill:['Urgent','Called back','Technician on site','Done'],next:['Call the customer back','Send a technician','Complete callout',''],
    box:[f=>`<h3>Emergency at the top</h3><p>${f}’s report is flagged and the responsible person was alerted right away. Photos and address are already there.</p>`,
     f=>`<h3>Called back</h3><p>Your team has spoken to ${f} and can assess the situation. The system makes no diagnosis; that’s your technician’s job.</p>`,
     f=>`<h3>Technician on the way</h3><p>${f} gets a short message that someone is on the way.</p><div class="sms">Hi ${f}, our technician is on the way to you. If you have questions, you can reach us at this number.</div>`,
     f=>`<h3>Done</h3><p>A review request follows automatically, and the callout is saved in the customer’s history.</p><div class="sms">Thanks, ${f}! If you were happy with our work, we’d really appreciate a quick Google review.</div>`]},
   proj:{st:['New','Site visit','Quote','Follow-up'],pill:['Reply today','Visit booked','Quote sent','Follow-up sent'],next:['Confirm site visit','Send quote','No reply after 3 days',''],
    box:[f=>`<h3>What happens next</h3><p>Confirm the site visit with ${f}. With photos and details, you know what to expect beforehand.</p>`,
     f=>`<h3>Site visit booked</h3><p>${f} gets an automatic reminder the day before.</p><div class="sms">Hi ${f}, a reminder that we’re coming for the site visit tomorrow at 10 am. See you then!</div>`,
     f=>`<h3>Quote sent</h3><p>If ${f} doesn’t reply within 3 days, a friendly check-in goes out on its own.</p>`,
     f=>`<h3>Check-in sent automatically</h3><p>No one had to remember. After completion, the yearly maintenance reminder follows automatically.</p><div class="sms">Hi ${f}, did you get our quote? Happy to answer any questions.</div>`]},
   svc:{st:['New','Booked','Done','Next service'],pill:['Reply today','Appointment booked','Done','Service due'],next:['Confirm appointment','Mark as done','12 months later',''],
    box:[f=>`<h3>What happens next</h3><p>Confirm the appointment with ${f}. The nameplate photo shows you which parts to bring.</p>`,
     f=>`<h3>Appointment booked</h3><p>${f} gets an automatic reminder the day before.</p><div class="sms">Hi ${f}, a reminder that we’re coming tomorrow morning. See you then!</div>`,
     f=>`<h3>Done</h3><p>A review request goes out automatically.</p><div class="sms">Thanks, ${f}! If you were happy, we’d really appreciate a quick Google review.</div>`,
     f=>`<h3>Maintenance reminder, automatically</h3><p>Repeat business, without anyone having to remember.</p><div class="sms">Hi ${f}, your yearly service is due again. Would you like an appointment? Just reply to this message.</div>`]}},
  exNotes:{em:'Water coming out of the bathroom wall. Main valve is closed.',proj:'Old bathroom from the 90s. Remove the tub, add a walk-in shower.',svc:'Boiler shows fault F28, heating stays cold.'},exArea:'Lindengasse 14, Top 3',exPhoto:'Example photo',photo:'Photo'}
};
const O={
 em:[['Rohrbruch','Burst pipe'],['Heizung ausgefallen','Heating failed'],['Verstopfung','Blocked drain'],['Wasserschaden','Water damage'],['Kein Warmwasser','No hot water'],['Gasgeruch','Gas smell']],
 proj:[['Badsanierung','Bathroom renovation'],['Heizungstausch','Heating replacement'],['Wärmepumpe','Heat pump'],['Klimaanlage','Air conditioning'],['Neue Sanitärinstallation','New plumbing installation']],
 bld:[['Wohnung','Apartment'],['Haus','House'],['Mehrparteienhaus','Multi-family building'],['Gewerbe','Commercial']],
 heat:[['Gas','Gas'],['Öl','Oil'],['Fernwärme','District heating'],['Strom','Electric'],['Weiß nicht','Not sure']],
 when:[['So schnell wie möglich','As soon as possible'],['In 1–3 Monaten','In 1–3 months'],['In 3–6 Monaten','In 3–6 months'],['Ich informiere mich nur','Just looking']],
 unit:[['Gastherme','Gas boiler'],['Heizkessel','Heating boiler'],['Wärmepumpe','Heat pump'],['Klimaanlage','Air conditioning'],['Warmwasserspeicher','Hot water cylinder'],['Andere','Other']],
 age:[['unter 5 Jahre','under 5 years'],['5–15 Jahre','5–15 years'],['über 15 Jahre','over 15 years'],['Weiß nicht','Not sure']],
 time:[['Vormittag','Morning'],['Nachmittag','Afternoon'],['Egal','Any time']]
};
const GAS=5;
const app=document.getElementById('app');
let lang='de',s,step,view,stage;
const t=()=>T[lang]; const L=(k,i)=>O[k][i][lang==='de'?0:1];
const flow=()=>s.type===0?'em':s.type===3?'proj':'svc';
const path=()=>s.type<0?['type']:s.type===0?['type','em','photos','contact']:s.type===3?['type','proj','where','when','photos','contact']:['type','unit','notes','photos','contact'];
const total=()=>s.type<0?5:path().length;
function reset(){s={type:-1,em:-1,proj:-1,bld:-1,heat:-1,when:-1,unit:-1,age:-1,time:-1,photos:[],notes:'',name:'',phone:'',area:'',ex:false};step=0;view='customer';stage=0;}
function example(){s={type:0,em:0,proj:-1,bld:0,heat:-1,when:-1,unit:-1,age:-1,time:-1,photos:['ex','ex'],notes:'',name:'Maria Huber',phone:'0664 210 3344',area:'',ex:true};}
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const notes=()=>s.ex&&!s.notes?t().exNotes[flow()]:s.notes; const area=()=>s.ex&&!s.area?t().exArea:s.area;
const chips=k=>'<div class="chips" role="group">'+O[k].map((_,i)=>`<button type="button" class="chip" aria-pressed="${s[k]===i}" data-key="${k}" data-i="${i}">${esc(L(k,i))}</button>`).join('')+'</div>';
const progress=()=>`<div class="prog"><span>${t().your}</span><span>${t().step(step,total())}</span></div><div class="bar"><i style="width:${step/total()*100}%"></i></div>`;
const nav=(ok,label,red)=>`<div class="row-btns"><button type="button" class="back" data-act="back">${t().back}</button><button type="button" class="btn ${red?'red':''}" data-act="next" ${ok?'':'disabled'}>${label||t().cont}</button></div>`;
const exPhoto=i=>'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="${['#DCE5EE','#E8E3DA','#E0E7E2','#E6E2EB'][i%4]}"/><rect y="68" width="100" height="32" fill="#B9C3CD"/><rect x="${18+i*8}" y="10" width="9" height="62" fill="#7F8C99"/><rect x="${18+i*8}" y="36" width="${50-i*6}" height="9" fill="#7F8C99"/><path d="M${48+i*4} 54c4 6 4 9 0 9s-4-3 0-9z" fill="#0E6CB3"/></svg>`);
const thumbs=()=>s.photos.length?'<div class="thumbs">'+s.photos.map((p,i)=>`<img src="${p==='ex'?exPhoto(i):p}" alt="${p==='ex'?t().exPhoto:t().photo}">`).join('')+'</div>':'';
const first=()=>{const n=(s.name||'').trim();if(!n)return lang==='de'?'Hallo':'there';return esc(n.split(' ')[0]);};
function chrome(){document.documentElement.lang=lang;
 document.getElementById('demoText').textContent=t().demo;document.getElementById('brandSub').textContent=t().sub;document.getElementById('footText').textContent=t().foot;
 document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
 document.title=lang==='de'?'Anfrage-Demo für Bozogul':'Request demo for Bozogul';}
function render(){
 chrome(); if(view==='team'){renderTeam();return;}
 const x=t(); let h=''; const E=s.type===0;
 const id=step>0&&step<=total()?path()[step-1]:null;
 if(step===0) h=`<div class="panel reveal"><h1>${x.startH}</h1><p class="hint" style="margin:0">${x.startP}</p><ul class="intro-list">${x.list.map(i=>`<li>${i}</li>`).join('')}</ul><button type="button" class="btn" data-act="next">${x.start}</button><button type="button" class="link" data-act="example">${x.example}</button></div>`;
 else if(id==='type') h=`<div class="panel">${progress()}<h2>${x.qType}</h2><div style="margin-top:14px">${x.types.map((tp,i)=>`<button type="button" class="choice ${i===0?'em':''}" aria-pressed="${s.type===i}" data-key="type" data-i="${i}"><b>${tp[0]}</b><span>${tp[1]}</span></button>`).join('')}</div>${nav(s.type>=0)}</div>`;
 else if(id==='em') h=`<div class="panel">${progress()}<h2>${x.qEm}</h2><p class="hint">${x.qEmH}</p>${chips('em')}${s.em===GAS?`<div class="warn">${x.gas}</div>`:''}<div class="group-label">${x.descL}</div><textarea id="notes" aria-label="${x.descL}" placeholder="${x.descEm}">${esc(s.notes)}</textarea>${nav(s.em>=0)}</div>`;
 else if(id==='proj') h=`<div class="panel">${progress()}<h2>${x.qProj}</h2><p class="hint">${x.qProjH}</p>${chips('proj')}${nav(s.proj>=0)}</div>`;
 else if(id==='where') h=`<div class="panel">${progress()}<h2>${x.qWhere}</h2><p class="hint">${x.qWhereH}</p><div class="group-label">${x.bldL}</div>${chips('bld')}${[1,2].includes(s.proj)?`<div class="group-label">${x.heatL}</div>${chips('heat')}`:''}${nav(s.bld>=0&&(![1,2].includes(s.proj)||s.heat>=0))}</div>`;
 else if(id==='when') h=`<div class="panel">${progress()}<h2>${x.qWhen}</h2><p class="hint">${x.qWhenH}</p>${chips('when')}${nav(s.when>=0)}</div>`;
 else if(id==='unit') h=`<div class="panel">${progress()}<h2>${x.qUnit}</h2><p class="hint">${x.qUnitH}</p><div class="group-label">${x.unitL}</div>${chips('unit')}<div class="group-label">${x.ageL}</div>${chips('age')}${nav(s.unit>=0&&s.age>=0)}</div>`;
 else if(id==='notes') h=`<div class="panel">${progress()}<h2>${x.qNotes}</h2><p class="hint">${s.type===2?x.qNotesHrep:x.qNotesHmnt}</p><textarea id="notes" aria-label="${x.qNotes}" placeholder="${x.qNotesP}">${esc(s.notes)}</textarea>${nav(true)}</div>`;
 else if(id==='photos') h=`<div class="panel">${progress()}<h2>${x.qPhotos}</h2><p class="hint">${x.qPhotosH[flow()]}</p><label class="drop" for="ph"><b>${x.add}</b><span>${x.addS}</span></label><input id="ph" type="file" accept="image/*" multiple hidden>${thumbs()}${nav(true,s.photos.length?x.cont:x.skip)}</div>`;
 else if(id==='contact') h=`<div class="panel">${progress()}<h2>${x.qContact}</h2><p class="hint">${E?x.qContactH.em:x.qContactH.other}</p>
   <label class="f" for="nm">${x.nm}</label><input class="t" id="nm" autocomplete="name" value="${esc(s.name)}">
   <label class="f" for="pn">${x.pn}</label><input class="t" id="pn" type="tel" autocomplete="tel" value="${esc(s.phone)}">
   <label class="f" for="ar">${x.ar}</label><input class="t" id="ar" autocomplete="street-address" value="${esc(s.area)}">
   ${E?'':`<div class="group-label">${x.callL}</div>${chips('time')}`}<div class="err" id="err" role="alert"></div>${nav(true,E?x.sendEm:x.send,E)}</div>`;
 else h=`<div class="panel reveal"><div class="tick" aria-hidden="true" style="${E?'background:#FCEBE9;color:#C4291C':''}">${E?'!':'✓'}</div><h1>${E?x.thanksEm(first()):x.thanks(first())}</h1><p class="hint" style="margin:0">${E?x.thanksEmP:x.thanksP}</p>${E&&s.em===GAS?`<div class="warn">${x.gas}</div>`:''}<div class="sms-label">${x.smsL}</div><div class="sms">${E?x.smsEm(first()):x.sms(first(),s.photos.length)}</div><button type="button" class="btn" data-act="team">${x.see}</button><button type="button" class="link" data-act="restart">${x.restart}</button></div>`;
 app.innerHTML=h;
 const ph=document.getElementById('ph');
 if(ph) ph.addEventListener('change',e=>{const files=[...e.target.files].slice(0,8-s.photos.length);let left=files.length;if(!left)return;files.forEach(f=>{const r=new FileReader();r.onload=()=>{s.photos.push(r.result);if(--left===0)render();};r.readAsDataURL(f);});});
}
function renderTeam(){
 const x=t(),f=first(),F=x.flows[flow()],R=x.rows,E=s.type===0;const v=k=>s[k]>=0?esc(L(k,s[k])):x.notGiven;
 const tl=x.types[s.type][0];
 const what=E?v('em'):s.type===3?v('proj'):v('unit');
 const rows=[[R.name,esc(s.name||x.notGiven)],[R.phone,esc(s.phone||x.notGiven)],[R.addr,esc(area()||x.notGiven)],[R.type,esc(tl)],[R.what,what]];
 if(s.type===3){rows.push([R.bld,v('bld')]);if([1,2].includes(s.proj))rows.push([R.heat,v('heat')]);rows.push([R.when,v('when')]);}
 if(s.type===1||s.type===2)rows.push([R.age,v('age')]);
 if(!E)rows.push([R.time,s.time>=0?v('time'):x.anyTime]);
 rows.push([R.photos,s.photos.length?x.photosN(s.photos.length):x.noPhotos]);
 const q=lang==='de'?['„','“']:['“','”'];
 app.innerHTML=`<div class="switch" role="group"><button type="button" aria-pressed="false" data-act="customer">${x.cust}</button><button type="button" aria-pressed="true">${x.recv}</button></div>
  <article class="card reveal"><div class="card-hd" style="${E?'border-bottom-color:#C4291C':''}"><div><small>${E?x.newEm:x.newReq}</small><b>${what}</b></div><span class="pill" style="${E&&stage===0?'background:#C4291C':''}">${F.pill[stage]}</span></div>
  ${E&&stage===0?`<div style="padding:0 20px"><div class="alertline">● ${x.alertTeam}</div></div>`:''}
  ${E&&s.em===GAS?`<div style="padding:0 20px"><div class="warn">${x.gas}</div></div>`:''}
  <dl class="dl">${rows.map(([k,val])=>`<div><dt>${k}</dt><dd>${val}</dd></div>`).join('')}</dl>
  ${notes()?`<div class="words"><b>${x.words}</b>${q[0]}${esc(notes())}${q[1]}</div>`:''}${thumbs()}</article>
  <div class="stages">${F.st.map((n,i)=>`<div class="stage ${i<=stage?'done':''} ${i===stage?'now':''}"><i></i>${n}</div>`).join('')}</div>
  <div class="next-box">${F.box[stage](f)}</div>
  ${F.next[stage]?`<button type="button" class="btn" data-act="advance">${F.next[stage]}</button>`:''}
  <button type="button" class="link" data-act="restart">${x.restart}</button>`;
}
function saveFields(){const g=id=>document.getElementById(id);if(g('notes'))s.notes=g('notes').value;if(g('nm'))s.name=g('nm').value;if(g('pn'))s.phone=g('pn').value;if(g('ar'))s.area=g('ar').value;}
document.querySelector('.lang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;saveFields();lang=b.dataset.lang;render();});
app.addEventListener('click',e=>{
 const c=e.target.closest('[data-key]');
 if(c){const k=c.dataset.key,i=+c.dataset.i;saveFields();if(k==='type'&&s.type!==i){s.photos=[];s.notes='';}s[k]=i;render();return;}
 const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;saveFields();
 if(act==='next'){const id=path()[step-1];if(id==='contact'){const err=document.getElementById('err');
   if(!s.name.trim()){err.textContent=t().errN;document.getElementById('nm').focus();return;}
   if(!s.phone.trim()){err.textContent=t().errP;document.getElementById('pn').focus();return;}
   if(!s.area.trim()){err.textContent=t().errA;document.getElementById('ar').focus();return;}}
  step++;}
 else if(act==='back')step=Math.max(0,step-1);
 else if(act==='example'){example();step=total()+1;}
 else if(act==='team'){view='team';stage=0;}
 else if(act==='customer'){view='customer';}
 else if(act==='advance'){stage=Math.min(3,stage+1);}
 else if(act==='restart'){reset();}
 render();window.scrollTo({top:0});const h=app.querySelector('h1,h2');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});}
});
reset();render();
})();
</script>
</body>
</html>
