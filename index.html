<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bozogul Notdienst-Assistent – Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--blue:#0E6CB3;--blue-ink:#0A5592;--blue-soft:#EAF3FB;--ink:#0B1218;--body:#2A3440;--mute:#5E6A77;--line:#DDE3EA;--bg:#F2F5F8;--surface:#FFFFFF;--red:#C4291C;--red-soft:#FCEBE9;--green:#18794A;--green-soft:#E5F4EC;--wa:#DCF8C6;
 color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--blue:#2F8BD6;--blue-ink:#8CC2F0;--blue-soft:#10263A;--ink:#EEF2F6;--body:#C8D0D8;--mute:#94A0AC;--line:#24303C;--bg:#0A0F14;--surface:#121921;--red:#FF8A7E;--red-soft:#3A1714;--green:#6CD39C;--green-soft:#10301F;--wa:#1F4D37;color-scheme:dark}}
:root[data-theme="dark"]{--blue:#2F8BD6;--blue-ink:#8CC2F0;--blue-soft:#10263A;--ink:#EEF2F6;--body:#C8D0D8;--mute:#94A0AC;--line:#24303C;--bg:#0A0F14;--surface:#121921;--red:#FF8A7E;--red-soft:#3A1714;--green:#6CD39C;--green-soft:#10301F;--wa:#1F4D37;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--body);font-family:Barlow,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:"Barlow Semi Condensed",Barlow,sans-serif;color:var(--ink);margin:0;letter-spacing:.01em}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#0B1218;color:#fff;font-size:13px}
.top span{flex:1}
.lang{display:flex;border:1px solid #33404D;border-radius:999px;overflow:hidden;flex:0 0 auto}
.lang button{background:none;border:0;color:#AEB8C2;font-size:12px;font-weight:700;padding:4px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--blue);color:#fff}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand img{height:40px;background:#fff;border-radius:6px;padding:4px 7px;display:block}
.brand small{font-size:13px;color:var(--mute);line-height:1.3}
.pipe{height:3px;width:110px;background:repeating-linear-gradient(90deg,var(--blue) 0 20px,transparent 20px 26px);margin:14px 0 18px;border-radius:2px}
.kick{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;color:var(--blue-ink);letter-spacing:.12em;text-transform:uppercase;font-size:13px}
h1.hero{font-size:38px;line-height:1.05;text-transform:uppercase;margin-top:6px}
.lead{color:var(--mute);font-size:17px;margin:0}
.scen{display:grid;gap:10px;margin-top:22px}
.sc{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;cursor:pointer}
.sc:hover{border-color:var(--blue)}
.sc .t{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:22px;color:var(--ink);min-width:62px;line-height:1}
.sc .t small{display:block;font-size:12px;color:var(--mute);font-family:Barlow,sans-serif;font-weight:600;margin-top:4px}
.sc b{display:block;color:var(--ink);font-size:17px}
.sc span{font-size:14px;color:var(--mute)}
.sc.em{border-left:4px solid var(--red)}
.sc .go{margin-left:auto;width:40px;height:40px;border-radius:50%;background:#1FA855;display:grid;place-items:center;flex:0 0 auto;color:#fff}
.sound{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:14px;color:var(--mute)}
.sw{position:relative;width:42px;height:24px;border-radius:999px;background:var(--line);border:0;cursor:pointer;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--blue)}.sw[aria-checked="true"]::after{left:21px}
.fine{font-size:12.5px;color:var(--mute);margin-top:18px}
/* call */
.call{background:linear-gradient(#18263A,#0B1218);color:#fff;border-radius:28px;padding:22px 20px 18px;min-height:560px;display:flex;flex-direction:column;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.call .meta{text-align:center}
.call .meta small{color:#9FB0C3;font-size:13px}
.call .meta .num{font-size:24px;font-weight:600;margin:2px 0}
.call .meta .who{color:#9FB0C3;font-size:13.5px}
.call .clock{font-variant-numeric:tabular-nums;color:#CFD8E3;font-size:14px;margin-top:4px}
.wave{display:flex;gap:3px;align-items:center;justify-content:center;height:44px;margin:14px 0 6px}
.wave i{display:block;width:4px;border-radius:2px;height:5px;background:#5B8FD0;transition:height .1s}
.speaker{text-align:center;font-size:12.5px;color:#9FB0C3;min-height:18px}
.tx{flex:1;overflow-y:auto;margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:330px;padding-right:2px}
.ln{max-width:86%;padding:9px 12px;border-radius:14px;font-size:15px;line-height:1.4;animation:fi .25s ease both}
.ln small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75;margin-bottom:1px}
.ln.ai{background:#1F3A5A;align-self:flex-start;border-bottom-left-radius:4px}
.ln.cu{background:#2B3440;align-self:flex-end;border-bottom-right-radius:4px}
.ln.act{align-self:center;background:transparent;border:1px dashed #4D6684;color:#CFE0F5;font-size:13px;text-align:center}
.ln.warn{align-self:stretch;max-width:none;background:#5A1A14;border:1px solid #C4291C}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cbtns{display:flex;justify-content:center;gap:16px;margin-top:14px}
.cbtn{border:0;border-radius:999px;padding:10px 16px;font-weight:600;cursor:pointer;background:#2B3440;color:#fff;font-size:14px}
.cbtn.end{background:#E5484D}
/* result */
.res h2{font-size:26px;text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:14px;overflow:hidden}
.ch{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.ch b{color:var(--ink)}
.ch .tag{margin-left:auto}
.cb{padding:14px 16px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue-ink);white-space:nowrap}
.tag.red{background:var(--red-soft);color:var(--red)}.tag.green{background:var(--green-soft);color:var(--green)}
.wa{background:var(--wa);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:15px;color:var(--ink);white-space:pre-line}
.wa small{display:block;font-size:12px;color:var(--mute);margin-top:6px;text-align:right}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:15px}
.kv dt{color:var(--mute)}.kv dd{margin:0;color:var(--ink);font-weight:500}
details{margin-top:10px}
summary{cursor:pointer;color:var(--blue-ink);font-weight:600}
.tl{font-size:14px;margin-top:8px;display:grid;gap:4px}
.tl b{color:var(--ink)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-weight:600;font-size:16px;cursor:pointer;background:var(--blue);color:#fff;margin-top:18px}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.why{margin-top:18px;border-left:4px solid var(--blue);padding:4px 0 4px 14px;font-size:15px;color:var(--body)}
.why b{color:var(--ink)}
.foot{text-align:center;font-size:13px;color:var(--mute);margin-top:26px}
.foot a{color:var(--blue-ink);text-decoration:none;font-weight:600}
@media (prefers-reduced-motion:reduce){.ln{animation:none}.wave i{transition:none}}
</style>
</head>

const L=a=>a[lang==='de'?0:1];
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app');
const synth=window.speechSynthesis;
const canSpeak=!!(synth&&window.SpeechSynthesisUtterance);
function voices(){if(!canSpeak)return [];const code=lang==='de'?'de':'en';return synth.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith(code));}
function clearAll(){timers.forEach(clearTimeout);timers=[];clearInterval(clockT);clearInterval(waveT);if(canSpeak)synth.cancel();speaking=null;}
function chrome(){document.documentElement.lang=lang;document.getElementById('topText').textContent=tt('Demo für Bozogul von Otonomix · simulierter Anruf, es wird niemand angerufen','Demo for Bozogul by Otonomix · simulated call, nobody is actually called');
 document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));document.title=tt('Bozogul Notdienst-Assistent – Demo','Bozogul emergency assistant – demo');}
const foot=()=>`<p class="foot">${tt('Erstellt von Otonomix als Beispiel.','Built by Otonomix as a sample.')} <a href="mailto:otonomix@outlook.com">otonomix@outlook.com</a></p>`;
const brand=()=>`<div class="brand"><img src="${LOGO}" alt="Ihr Installateur Bozogul"><small>${tt('Digitaler Telefon-Assistent','Digital phone assistant')}<br>${tt('Konzept-Demo','Concept demo')}</small></div>`;
function intro(){clearAll();view='intro';chrome();
 app.innerHTML=brand()+`<div class="kick">${tt('Notdienst rund um die Uhr','24/7 emergency service')}</div><h1 class="hero">${tt('Das Telefon klingelt. Ihr Team ist nicht da.','The phone rings. Your team isn’t there.')}</h1><div class="pipe"></div>
 <p class="lead">${tt('Feierabend, Wochenende oder mitten im Einsatz. Hören Sie, wer jetzt für Bozogul abhebt.','After hours, at the weekend or in the middle of a job. Listen to who answers for Bozogul now.')}</p>
 <div class="scen">${Object.keys(SC).map(k=>{const s=SC[k];return `<button class="sc ${s.em?'em':''}" type="button" data-sc="${k}"><div class="t">${s.time}<small>${esc(L(s.day))}</small></div><div><b>${esc(L(s.title))}</b><span>${esc(L(s.sub))}</span></div><span class="go" aria-hidden="true"><svg viewBox="0 0 20 20" width="18" height="18"><path d="M5 3h3l1.5 4-2 1.2a8.5 8.5 0 004.3 4.3L13 10.5l4 1.5v3a1 1 0 01-1 1A13 13 0 014 4a1 1 0 011-1z" fill="currentColor"/></svg></span></button>`;}).join('')}</div>
 <div class="sound"><button class="sw" type="button" role="switch" aria-checked="${sound&&canSpeak}" ${canSpeak?'':'disabled'} data-a="sound" aria-label="${tt('Ton','Sound')}"></button>${canSpeak?tt('Mit Ton anhören (Lautsprecher an)','Listen with sound (turn your volume up)'):tt('Ihr Browser unterstützt keine Sprachausgabe. Der Anruf wird als Text gezeigt.','Your browser doesn’t support speech. The call is shown as text.')}</div>
 <p class="fine">${tt('Hinweis: In der Demo spricht die einfache Stimme Ihres Browsers. Im echten System klingt der Assistent natürlich, spricht Deutsch und kennt Ihre Leistungen, Zeiten und Abläufe.','Note: the demo uses your browser’s basic voice. In the real system, the assistant sounds natural, speaks German and knows your services, hours and processes.')}</p>`+foot();}
function startCall(k){clearAll();sc=SC[k];view='call';idx=0;ended=false;chrome();
 app.innerHTML=brand()+`<div class="call" role="region" aria-label="${tt('Anruf','Call')}"><div class="meta"><small>${esc(L(sc.day))} · ${sc.time}</small><div class="num">${sc.num}</div><div class="who">${tt('Angenommen vom digitalen Assistenten von Bozogul','Answered by Bozogul’s digital assistant')}</div><div class="clock" id="clock">0:00</div></div>
  <div class="wave" id="wave" aria-hidden="true">${Array.from({length:26},()=>'<i></i>').join('')}</div><div class="speaker" id="spk" aria-live="polite"></div>
  <div class="tx" id="tx" aria-live="polite"></div>
  <div class="cbtns"><button class="cbtn" type="button" data-a="skip">${tt('Zum Ergebnis springen','Skip to result')}</button><button class="cbtn end" type="button" data-a="hang">${tt('Auflegen','Hang up')}</button></div></div>`+foot();
 clockStart=Date.now();clockT=setInterval(()=>{const s=Math.floor((Date.now()-clockStart)/1000);const c=document.getElementById('clock');if(c)c.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;},500);
 waveT=setInterval(()=>{const w=document.getElementById('wave');if(!w)return;[...w.children].forEach((b,i)=>{b.style.height=(speaking?6+Math.abs(Math.sin(Date.now()/90+i*1.3))*32:4)+'px';b.style.background=speaking==='cu'?'#8C99A8':'#5B8FD0';});},90);
 timers.push(setTimeout(next,700));}
function next(){if(ended||!sc)return;if(idx>=sc.lines.length){timers.push(setTimeout(()=>result(),1100));return;}
 const [who,txt]=sc.lines[idx++];const text=L(txt);const tx=document.getElementById('tx');if(!tx)return;
 const label=who==='ai'?tt('Assistent','Assistant'):who==='cu'?tt('Anrufer','Caller'):who==='warn'?tt('Assistent · Sicherheitshinweis','Assistant · safety instructions'):'';
 tx.insertAdjacentHTML('beforeend',`<div class="ln ${who}">${label?`<small>${label}</small>`:''}${esc(text)}</div>`);tx.scrollTop=tx.scrollHeight;
 const spk=document.getElementById('spk');
 if(who==='act'){speaking=null;if(spk)spk.textContent='';timers.push(setTimeout(next,1500));return;}
 const role=who==='cu'?'cu':'ai';speaking=role;if(spk)spk.textContent=role==='ai'?tt('Assistent spricht','Assistant speaking'):tt('Anrufer spricht','Caller speaking');
 const done=()=>{speaking=null;if(spk)spk.textContent='';if(!ended)timers.push(setTimeout(next,450));};
 if(sound&&canSpeak){const u=new SpeechSynthesisUtterance(text);const vs=voices();u.lang=lang==='de'?'de-AT':'en-GB';
  if(vs.length){const at=vs.find(v=>/AT/i.test(v.lang));u.voice=role==='ai'?(at||vs[0]):(vs[1]||vs[0]);}
  u.rate=role==='ai'?1.0:1.08;u.pitch=role==='ai'?1.05:0.85;let fired=false;const fin=()=>{if(fired)return;fired=true;done();};u.onend=fin;u.onerror=fin;
  timers.push(setTimeout(fin,Math.max(4000,text.length*95)));synth.speak(u);}
 else timers.push(setTimeout(done,Math.min(4200,900+text.length*38)));}
function result(){clearAll();if(!sc)return;view='result';chrome();const s=sc;
 const transcript=s.lines.filter(l=>l[0]!=='act').map(l=>`<div><b>${l[0]==='cu'?tt('Anrufer','Caller'):tt('Assistent','Assistant')}:</b> ${esc(L(l[1]))}</div>`).join('');
 app.innerHTML=brand()+`<div class="res"><div class="kick">${tt('Was danach passiert','What happens next')}</div><h2>${s.em?tt('Ihr Techniker weiß es in Sekunden.','Your technician knows within seconds.'):tt('Termin fixiert, ohne dass jemand abhebt.','Appointment booked, without anyone picking up.')}</h2><div class="pipe"></div>
 <div class="card"><div class="ch"><b>${s.em?tt('Aufs Handy des Bereitschaftstechnikers','To the on-call technician’s phone'):tt('An das Büro, per WhatsApp','To the office, on WhatsApp')}</b><span class="tag ${s.em?'red':''}">${tt('sofort','instantly')}</span></div><div class="cb"><div class="wa">${esc(L(s.tech))}<small>${s.time}</small></div></div></div>
 <div class="card"><div class="ch"><b>${tt('Im System gespeichert','Saved in the system')}</b><span class="tag ${s.em?'red':'green'}">${esc(L(s.result))}</span></div><div class="cb"><dl class="kv"><dt>${tt('Anrufer','Caller')}</dt><dd>${esc(s.cust)}</dd><dt>${tt('Adresse','Address')}</dt><dd>${esc(s.addr)}</dd><dt>${tt('Anliegen','Request')}</dt><dd>${esc(L(s.cat))}</dd><dt>${tt('Dringlichkeit','Urgency')}</dt><dd>${esc(L(s.urg))}</dd><dt>${tt('Zeitpunkt','Time')}</dt><dd>${esc(L(s.day))}, ${s.time}</dd></dl>
  <details><summary>${tt('Gesprächsprotokoll ansehen','View call transcript')}</summary><div class="tl">${transcript}</div></details></div></div>
 <div class="why">${s.em?tt('<b>Kein verpasster Notfall mehr</b>, auch wenn gerade niemand abheben kann. Der Assistent stellt keine Diagnose und verspricht keine Zeiten. Er sorgt dafür, dass die richtige Person sofort Bescheid weiß.','<b>No more missed emergencies</b>, even when nobody can pick up. The assistant makes no diagnosis and promises no times. It makes sure the right person knows straight away.'):tt('<b>Kein Auftrag geht verloren</b>, weil am Wochenende niemand abhebt. Ihr Büro bestätigt am Montag nur noch.','<b>No job is lost</b> because nobody picked up at the weekend. Your office just confirms on Monday.')}</div>
 <button class="btn" type="button" data-a="again">${tt('Anderen Anruf anhören','Listen to another call')}</button></div>`+foot();window.scrollTo({top:0});}
document.addEventListener('click',e=>{
 const lb=e.target.closest('[data-lang]');if(lb){lang=lb.dataset.lang;if(view==='call'){intro();}else if(view==='result')result();else intro();return;}
 const s=e.target.closest('[data-sc]');if(s){if(canSpeak&&sound){synth.cancel();const warm=new SpeechSynthesisUtterance(' ');warm.volume=0;synth.speak(warm);}startCall(s.dataset.sc);return;}
 const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a;
 if(k==='sound'){sound=!sound;a.setAttribute('aria-checked',sound);}
 if(k==='skip'){ended=true;result();}
 if(k==='hang'){ended=true;clearAll();intro();}
 if(k==='again')intro();
});
if(canSpeak&&synth.onvoiceschanged!==undefined)synth.onvoiceschanged=()=>{};
intro();
})();
</script>
